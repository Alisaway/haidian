  --shadow:0 8px 32px rgba(0,0,0,.1);
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--text);
  font-family:"SF Pro Display","Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(107,92,231,.3);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:rgba(107,92,231,.45)}

/* ── Background ── */
.bg-layer{position:fixed;inset:0;z-index:0;pointer-events:none}
.bg-orb{position:absolute;border-radius:50%;filter:blur(80px);opacity:.35}
.bg-orb.o1{width:500px;height:500px;background:#a78bfa;top:-120px;left:-80px;opacity:.12}
.bg-orb.o2{width:400px;height:400px;background:#7dd3fc;bottom:-100px;right:-60px;opacity:.08}
.bg-orb.o3{width:300px;height:300px;background:#fcd34d;top:40%;left:50%;opacity:.04}
.bg-grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(107,92,231,.04) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(107,92,231,.04) 1px,transparent 1px);
  background-size:60px 60px}

/* ── App shell ── */
.app{position:relative;z-index:1;height:100vh;display:flex;flex-direction:column;
  align-items:center;justify-content:center;padding:8px}
.frame{width:1600px;max-width:99vw;height:960px;max-height:97vh;
  background:linear-gradient(160deg,rgba(255,255,255,.97),rgba(248,246,240,.98));
  border:1px solid var(--border);border-radius:20px;
  box-shadow:0 24px 80px rgba(0,0,0,.12),inset 0 1px 0 rgba(255,255,255,.8);
  overflow:hidden;display:flex;flex-direction:column;
  backdrop-filter:blur(20px)}

/* ── Header ── */
.header{display:flex;align-items:center;justify-content:space-between;
  padding:5px 20px;border-bottom:1px solid var(--border);
  background:rgba(255,255,255,.7);backdrop-filter:blur(10px)}
.h-left{display:flex;align-items:center;gap:8px}
.h-icon{width:24px;height:24px;border-radius:6px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;color:#fff;
  font-weight:800;font-size:11px;box-shadow:0 2px 8px rgba(107,92,231,.4)}
.h-title{font-size:13px;font-weight:600;color:#57534e;letter-spacing:.3px}
.h-badge{font-size:10px;color:var(--dim);letter-spacing:1.5px;text-transform:uppercase;
  padding:2px 8px;border:1px solid var(--border);border-radius:20px}

/* ── Content ── */
.content{flex:1;overflow:hidden;position:relative}
.page{position:absolute;inset:0;overflow:hidden;padding:14px 56px 10px;
  display:flex;flex-direction:column;
  opacity:0;transform:translateY(12px);transition:opacity .4s ease,transform .4s ease;
  pointer-events:none}
.page.active{opacity:1;transform:translateY(0);pointer-events:auto}
.pg-head{flex:none}
.pg-sub{flex:none}

/* ── Cover ── */
.cover{display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;height:100%}
.cover-logo{width:200px;height:auto;margin-bottom:16px}
.cover-logo img{width:100%;height:auto;display:block}
.cover-title{font-size:56px;font-weight:800;letter-spacing:8px;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;line-height:1.2}
.cover-sub{font-size:20px;color:#0284c7;margin-top:10px;font-weight:300;letter-spacing:3px}
.cover-en{font-size:12px;color:var(--dim);margin-top:14px;letter-spacing:2px;text-transform:uppercase}
.cover-line{width:80px;height:2px;background:var(--grad);margin:16px auto;border-radius:1px}
.cover-desc{font-size:14px;color:var(--muted);margin-top:8px;max-width:560px;line-height:1.7}
.cover-tags{display:flex;gap:10px;margin-top:20px}
.cover-tag{padding:6px 16px;border:1px solid var(--border);border-radius:20px;
  font-size:12px;color:var(--muted);letter-spacing:.5px}

/* ── Page header ── */
.pg-head{display:flex;align-items:center;gap:10px;margin-bottom:12px;padding-bottom:8px;
  border-bottom:1px solid var(--border)}
.pg-icon{width:30px;height:30px;border-radius:8px;background:var(--grad);
  display:flex;align-items:center;justify-content:center;font-size:15px;flex:none;
  box-shadow:0 4px 12px rgba(107,92,231,.3)}
.pg-title{font-size:20px;font-weight:700;
  background:linear-gradient(135deg,#1c1917,#57534e);
  -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.pg-num{margin-left:auto;font-size:11px;color:var(--dim);font-family: 'NotoSCSubset', ui-monospace,monospace;
  letter-spacing:1px}
.pg-sub{font-size:13px;color:var(--muted);margin-bottom:10px;line-height:1.7}

/* ── Metric cards ── */
.metric-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px;flex:none}
.metric-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px 14px;transition:.3s;position:relative;overflow:hidden}
.metric-card:hover{border-color:var(--border-hover);transform:translateY(-2px);
  box-shadow:0 8px 24px rgba(107,92,231,.15)}
.metric-card::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;
  background:var(--grad);opacity:.5}
.metric-card.gold::after{background:var(--grad-gold)}
.metric-card.teal::after{background:var(--grad-teal)}
.metric-card.coral::after{background:var(--grad-coral)}
.mc-label{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.8px;margin-bottom:6px}
.mc-value{font-size:28px;font-weight:800;color:#1c1917;line-height:1}
.mc-unit{font-size:13px;color:var(--muted);font-weight:400;margin-left:4px}
.mc-desc{font-size:11px;color:var(--dim);margin-top:5px}

/* ── Donut charts ── */
.metrics-row{display:flex;gap:12px;flex:1;min-height:0;margin-bottom:6px}
.donut-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:14px 20px;flex:1;display:flex;flex-direction:column;min-width:0}
.donut-card-title{font-size:14px;font-weight:700;color:#44403c;margin-bottom:2px}
.donut-card-sub{font-size:10px;color:var(--dim);margin-bottom:6px}
.donut-wrap{display:flex;flex-direction:column;align-items:center;flex:1;min-height:0}
.donut-svg{flex:none;width:210px;height:210px;margin:auto 0}
.donut-center{font-size:13px;fill:var(--muted);text-anchor:middle}
.donut-center-val{font-size:32px;font-weight:800;fill:#1c1917;text-anchor:middle}
.donut-legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 18px;width:100%;min-width:0;padding-top:10px;flex:none}
.dl-item{display:flex;align-items:center;gap:6px;font-size:12px;color:#57534e;min-width:0}
.dl-dot{width:10px;height:10px;border-radius:2px;flex:none}
.dl-label{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.dl-val{font-weight:700;color:#1c1917;font-variant-numeric:tabular-nums;font-size:13px;flex:none;margin-left:auto;white-space:nowrap}
.dl-pct{color:var(--muted);font-size:11px;margin-left:2px;font-weight:400}
.metrics-side{display:flex;flex-direction:column;gap:8px;width:220px;flex:none}
.metric-card.compact{padding:10px 14px}
.metric-card.compact .mc-value{font-size:22px}
.metric-card.compact .mc-desc{font-size:10px;margin-top:4px}
.metric-card.compact .mc-label{margin-bottom:4px;font-size:11px}

/* ── Image card ── */
.img-card{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:10px;margin-bottom:10px;overflow:hidden;
  flex:1;min-height:0;display:flex;flex-direction:column}
.img-card img{flex:1;min-height:0;width:100%;border-radius:10px;display:block;object-fit:contain}
.img-caption{flex:none;font-size:12px;color:var(--muted);text-align:center;margin-top:6px;padding-bottom:2px}

/* ── Info table ── */
.info-table{width:100%;border-collapse:collapse;margin:6px 0;flex:none}
.info-table td{padding:7px 14px;font-size:13px;border-bottom:1px solid var(--border);
  vertical-align:middle}
.info-table td:first-child{color:#0284c7;font-weight:600;white-space:nowrap;width:28%;
  font-size:12px}
.info-table tr:hover td{background:rgba(107,92,231,.06)}

/* ── Highlight box ── */
.hl{margin:8px 0;padding:10px 16px;border-radius:10px;font-size:13px;line-height:1.7;flex:none;
  background:linear-gradient(135deg,rgba(107,92,231,.08),rgba(56,189,248,.04));
  border:1px solid rgba(107,92,231,.15);border-left:3px solid var(--purple);color:#57534e}
.hl.gold{border-left-color:var(--gold);background:linear-gradient(135deg,rgba(200,146,42,.08),rgba(200,146,42,.03))}
.hl b{color:#1c1917}

/* ── TOC ── */
.toc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;align-content:center}
.toc-item{display:flex;align-items:center;gap:12px;padding:12px 18px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  cursor:pointer;transition:.25s;color:#57534e;font-size:15px}
.toc-item:hover{background:var(--card-hover);color:#1c1917;border-color:var(--border-hover);
  transform:translateX(4px);box-shadow:0 4px 16px rgba(107,92,231,.12)}
.toc-emoji{font-size:24px}
.toc-label{flex:1}
.toc-arrow{color:var(--dim);font-size:16px;transition:.25s}
.toc-item:hover .toc-arrow{color:var(--purple);transform:translateX(3px)}

/* ── Scenario cards ── */
.sc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:1;grid-auto-rows:1fr}
.sc-card{display:flex;align-items:flex-start;gap:12px;padding:16px 14px;
  background:var(--card);border:1px solid var(--border);border-radius:12px;
  transition:.25s;position:relative;overflow:hidden;height:100%;box-sizing:border-box}
.sc-card:hover{border-color:var(--border-hover);transform:translateY(-1px)}
.sc-icon{font-size:22px;flex:none;width:32px;text-align:center}
.sc-body{flex:1;min-width:0}
.sc-id{font-family: 'NotoSCSubset', ui-monospace,monospace;font-size:11px;color:#0284c7;font-weight:600;
  letter-spacing:.5px}
.sc-name{font-size:14px;color:#1c1917;font-weight:600;margin:3px 0 2px}
.sc-users{font-size:12px;color:var(--dim)}
.tag{position:absolute;top:10px;right:10px;
  background:rgba(107,92,231,.1);color:#7c3aed;
  border:1px solid rgba(107,92,231,.25);border-radius:20px;padding:2px 10px;font-size:10px;
  white-space:nowrap}
.tag-test{position:absolute;top:10px;right:10px;
  background:rgba(232,93,74,.12);color:var(--coral);
  border:1px solid rgba(232,93,74,.25);border-radius:20px;padding:2px 10px;font-size:10px;
  white-space:nowrap}

/* ── Culture / timeline ── */
.culture-layers{display:flex;flex-direction:column;gap:12px;margin:10px 0;flex:1;min-height:0}
.cl-item{display:flex;gap:14px;padding:16px 20px;background:var(--card);
  border:1px solid var(--border);border-radius:12px;border-left:3px solid var(--purple);flex:1}
.cl-item.gold{border-left-color:var(--gold)}
.cl-item.teal{border-left-color:var(--teal)}
.cl-num{font-size:28px;font-weight:800;
  background:var(--grad);-webkit-background-clip:text;-webkit-text-fill-color:transparent;
  background-clip:text;line-height:1;flex:none;width:38px}
.cl-item.gold .cl-num{background:var(--grad-gold);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cl-item.teal .cl-num{background:var(--grad-teal);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.cl-title{font-size:15px;font-weight:700;color:#1c1917;margin-bottom:4px}
.cl-desc{font-size:13px;color:var(--muted);line-height:1.6}

/* ── Cases ── */
.case-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0;flex:none}
.case-item{display:flex;align-items:center;gap:12px;padding:10px 16px;
  background:var(--card);border:1px solid var(--border);border-radius:10px}
.case-name{font-size:14px;color:#0284c7;font-weight:600;white-space:nowrap;min-width:110px}
.case-desc{font-size:13px;color:var(--muted)}
.case-item.highlight{background:linear-gradient(135deg,rgba(107,92,231,.12),rgba(56,189,248,.06));
  border-color:rgba(107,92,231,.3)}
.case-item.highlight .case-name{color:#1c1917}

/* ── Landmark cards ── */
.lm-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:10px 0;flex:1;min-height:0;grid-auto-rows:1fr}
.lm-card{padding:18px 20px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;position:relative;overflow:hidden;transition:.3s;height:100%;box-sizing:border-box}
.lm-card:hover{border-color:var(--border-hover);transform:translateY(-2px)}
.lm-card::before{content:'';position:absolute;top:0;left:0;bottom:0;width:3px;background:var(--grad-gold)}
.lm-id{font-family: 'NotoSCSubset', ui-monospace,monospace;font-size:12px;color:var(--gold);font-weight:700;
  letter-spacing:1px}
.lm-name{font-size:17px;font-weight:700;color:#1c1917;margin:5px 0 4px}
.lm-loc{font-size:13px;color:#0284c7;margin-bottom:5px}
.lm-concept{font-size:13px;color:var(--muted);line-height:1.5}

/* ── Ops ── */
.ops-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:10px 0;flex:1;min-height:0;grid-auto-rows:1fr}
.ops-card{padding:16px 14px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  text-align:center;transition:.3s;height:100%;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
.ops-card:hover{border-color:var(--border-hover);transform:translateY(-2px)}
.ops-icon{font-size:26px;margin-bottom:6px}
.ops-name{font-size:15px;font-weight:700;color:#1c1917;margin-bottom:4px}
.ops-freq{font-size:12px;color:var(--cyan)}
.ops-desc{font-size:12px;color:var(--dim);margin-top:4px}

/* ── Baseline data ── */
.baseline-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:10px 0;flex:none}
.bl-card{padding:20px 22px;background:var(--card);border:1px solid var(--border);border-radius:12px;
  position:relative;transition:.3s;overflow:hidden}
.bl-card:hover{border-color:var(--border-hover);transform:translateY(-2px)}
.bl-card.gold{border-color:rgba(200,146,42,.3)}

.bl-card.purple{border-color:rgba(107,92,231,.3)}
.bl-card.purple::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad)}
.bl-card.teal{border-color:rgba(46,125,107,.3)}
.bl-card.teal::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--grad-teal)}
.bl-title{font-size:16px;font-weight:600;color:#57534e;margin-bottom:8px}
.bl-big{font-size:48px;font-weight:800;color:#1c1917;line-height:1}
.bl-unit{font-size:18px;font-weight:400;color:var(--muted);margin-left:4px}
.bl-desc{font-size:13px;color:var(--dim);margin-top:10px;line-height:1.6}

/* ── Compliance ── */
.comp-box{padding:24px 28px;border-radius:14px;
  background:linear-gradient(135deg,rgba(200,146,42,.06),rgba(200,146,42,.02));
  border:1px solid rgba(200,146,42,.2);margin:10px 0;flex:1;display:flex;flex-direction:column;overflow:hidden}
.comp-title{font-size:18px;font-weight:700;color:var(--gold);margin-bottom:14px;
  display:flex;align-items:center;gap:10px}
.comp-list{list-style:none;padding:0;flex:1;display:flex;flex-direction:column}
.comp-list li{padding:10px 0;font-size:14px;color:#57534e;line-height:1.7;
  border-bottom:1px solid rgba(0,0,0,.06);display:flex;align-items:center;gap:10px;flex:1}
.comp-list li:last-child{border-bottom:none}
.comp-list li::before{content:'✓';color:var(--green);font-weight:700;flex:none;font-size:16px}
.comp-list li b{color:#1c1917}

/* ── Footer ── */
.foot{padding:8px 0 0;border-top:1px solid var(--border);margin-top:10px;flex:none;
  color:var(--dim);font-size:11px;text-align:center;letter-spacing:.5px}

/* ── Bottom nav ── */
.footer-bar{display:flex;align-items:center;gap:18px;
  padding:6px 20px;border-top:1px solid var(--border);
  background:rgba(255,255,255,.7);backdrop-filter:blur(10px)}
.nav-btn{background:rgba(0,0,0,.03);color:var(--muted);
  border:1px solid var(--border);border-radius:10px;padding:6px 18px;font-size:12px;
  cursor:pointer;font-family: 'NotoSCSubset', inherit;transition:.2s;font-weight:500}
.nav-btn:hover:not(:disabled){background:rgba(107,92,231,.12);color:#1c1917;
  border-color:var(--purple);box-shadow:0 2px 8px rgba(107,92,231,.2)}
.nav-btn:disabled{opacity:.2;cursor:not-allowed}
.progress-wrap{flex:1;display:flex;align-items:center;gap:12px}
.progress-track{flex:1;height:4px;background:rgba(0,0,0,.08);border-radius:2px;overflow:hidden;cursor:pointer}
.progress-fill{height:100%;background:var(--grad);border-radius:2px;transition:width .3s ease;
  box-shadow:0 0 8px rgba(107,92,231,.5)}
.pg-label{font-size:13px;color:var(--muted);font-family: 'NotoSCSubset', ui-monospace,monospace;
  min-width:60px;text-align:center;font-weight:600}
</style>
</head>

function render(){
  content.innerHTML=renderPage(pages[cur],cur);
  var els=content.querySelectorAll(".page");
  if(els.length)els[0].classList.add("active");
  update();
  var items=content.querySelectorAll(".toc-item");
  for(var j=0;j<items.length;j++){
    (function(it){it.addEventListener("click",function(){
      var t=it.getAttribute("data-goto");if(t)goById(t)})})(items[j])
  }
}
function update(){
  pgLabel.textContent=String(cur+1).padStart(2,"0")+" / "+String(pages.length).padStart(2,"0");
  prevBtn.disabled=cur===0;nextBtn.disabled=cur===pages.length-1;
  progressFill.style.width=((cur+1)/pages.length*100)+"%";
}
function turn(d){var n=cur+d;if(n<0||n>=pages.length)return;cur=n;render()}
function go(i){if(i>=0&&i<pages.length&&i!==cur){cur=i;render()}}
function goById(id){for(var m=0;m<pages.length;m++)if(pages[m].id===id){go(m);return}}

prevBtn.addEventListener("click",function(){turn(-1)});
nextBtn.addEventListener("click",function(){turn(1)});
progressTrack.addEventListener("click",function(e){
  var rect=this.getBoundingClientRect();
  var pct=(e.clientX-rect.left)/rect.width;
  go(Math.round(pct*(pages.length-1)));
});
document.addEventListener("keydown",function(e){
  if(["INPUT","TEXTAREA"].includes(e.target.tagName))return;
  if(e.key==="ArrowRight"||e.key==="PageDown"){e.preventDefault();turn(1)}
  if(e.key==="ArrowLeft"||e.key==="PageUp"){e.preventDefault();turn(-1)}
  if(e.key==="Home"){e.preventDefault();go(0)}
  if(e.key==="End"){e.preventDefault();go(pages.length-1)}
  if(e.key===" "){e.preventDefault();turn(1)}
});
var tx=0;
content.addEventListener("touchstart",function(e){tx=e.changedTouches[0].clientX},{passive:true});
content.addEventListener("touchend",function(e){
  var dx=e.changedTouches[0].clientX-tx;
  if(Math.abs(dx)>50){dx<0?turn(1):turn(-1)}},{passive:true});
render();
</script>
