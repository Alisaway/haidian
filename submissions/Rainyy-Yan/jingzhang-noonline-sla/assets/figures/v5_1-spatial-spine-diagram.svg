<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="960" viewBox="0 0 1600 960" role="img" aria-labelledby="title desc">
  <title id="title">Conceptual spatial spine for Jing-Zhang Noonline SLA</title>
  <desc id="desc">A non-survey conceptual diagram with a north-south public spine, three prototype areas, two east-west cross-stitches, the three taskbook positioning bands, and five self-guided route actions.</desc>
  <rect width="1600" height="960" fill="#f5f7f8"/>
  <rect x="48" y="42" width="1504" height="876" rx="8" fill="#ffffff" stroke="#19334b" stroke-width="3"/>
  <text x="100" y="118" fill="#19334b" font-family="Arial, sans-serif" font-size="38" font-weight="700">CONCEPT SPATIAL SPINE</text>
  <text x="100" y="156" fill="#526270" font-family="Arial, sans-serif" font-size="21">NORTH-SOUTH PUBLIC READING ORDER + EAST-WEST ENTER / RETURN RELATIONS</text>
  <rect x="1180" y="95" width="292" height="58" rx="29" fill="#fff2c9" stroke="#b98520" stroke-width="2"/>
  <text x="1326" y="131" text-anchor="middle" fill="#6e4b09" font-family="Arial, sans-serif" font-size="18" font-weight="700">CONCEPT ONLY / NOT A SURVEY MAP</text>

  <line x1="800" y1="240" x2="800" y2="718" stroke="#19334b" stroke-width="10" stroke-linecap="round"/>
  <path d="M800 218 L778 252 L822 252 Z" fill="#19334b"/>
  <text x="838" y="236" fill="#19334b" font-family="Arial, sans-serif" font-size="21" font-weight="700">NORTH-SOUTH PUBLIC SPINE</text>
  <text x="838" y="266" fill="#526270" font-family="Arial, sans-serif" font-size="18">Level 2 orientation and public narrative only</text>

  <line x1="288" y1="410" x2="1312" y2="410" stroke="#e26f55" stroke-width="5" stroke-dasharray="16 13"/>
  <line x1="288" y1="570" x2="1312" y2="570" stroke="#e26f55" stroke-width="5" stroke-dasharray="16 13"/>
  <text x="300" y="386" fill="#a54b37" font-family="Arial, sans-serif" font-size="19" font-weight="700">WEST / ENTER-RETURN CROSS-STITCH</text>
  <text x="1008" y="546" fill="#a54b37" font-family="Arial, sans-serif" font-size="19" font-weight="700">EAST / ENTER-RETURN CROSS-STITCH</text>

  <rect x="108" y="332" width="315" height="122" rx="8" fill="#e6f3f1" stroke="#287b75" stroke-width="3"/>
  <text x="138" y="374" fill="#154f4b" font-family="Arial, sans-serif" font-size="25" font-weight="700">ZHONGGUANCUN</text>
  <text x="138" y="406" fill="#154f4b" font-family="Arial, sans-serif" font-size="20">Technology-service wing</text>
  <text x="138" y="434" fill="#526270" font-family="Arial, sans-serif" font-size="17">service / translation / governance edge</text>

  <rect x="1177" y="490" width="315" height="122" rx="8" fill="#f5eafa" stroke="#7e5d91" stroke-width="3"/>
  <text x="1207" y="532" fill="#583c6b" font-family="Arial, sans-serif" font-size="25" font-weight="700">XIAOYUE RIVER</text>
  <text x="1207" y="564" fill="#583c6b" font-family="Arial, sans-serif" font-size="20">Scenario-enablement wing</text>
  <text x="1207" y="592" fill="#526270" font-family="Arial, sans-serif" font-size="17">ecology / everyday scenario / feedback</text>

  <g font-family="Arial, sans-serif">
    <rect x="575" y="270" width="450" height="112" rx="8" fill="#e9f0f6" stroke="#19334b" stroke-width="3"/>
    <text x="610" y="313" fill="#19334b" font-size="25" font-weight="700">NORTH | ZHONGZHIYUAN</text>
    <text x="610" y="345" fill="#526270" font-size="20">Innovation band: visible research / protected clearway</text>

    <rect x="575" y="450" width="450" height="112" rx="8" fill="#fff4d8" stroke="#b98520" stroke-width="3"/>
    <text x="610" y="493" fill="#6e4b09" font-size="25" font-weight="700">CENTRE | AI ORIGIN</text>
    <text x="610" y="525" fill="#526270" font-size="20">Life-experience band: read / stay / question without a device</text>

    <rect x="575" y="630" width="450" height="112" rx="8" fill="#fce9e3" stroke="#b65a45" stroke-width="3"/>
    <text x="610" y="673" fill="#8c4132" font-size="25" font-weight="700">SOUTH | DAZHONGSI</text>
    <text x="610" y="705" fill="#526270" font-size="20">Cultural band: arrive / decide / pause / return to daily life</text>
  </g>

  <rect x="108" y="770" width="1384" height="104" rx="8" fill="#19334b"/>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <text x="238" y="808" fill="#ffe08a" font-size="17" font-weight="700">01 START</text>
    <text x="238" y="841" fill="#ffffff" font-size="16">fixed start + return choice</text>
    <text x="498" y="808" fill="#ffe08a" font-size="17" font-weight="700">02 WALK</text>
    <text x="498" y="841" fill="#ffffff" font-size="16">number + symbol + written cue</text>
    <text x="758" y="808" fill="#ffe08a" font-size="17" font-weight="700">03 PAUSE</text>
    <text x="758" y="841" fill="#ffffff" font-size="16">stay / bypass / return judgment</text>
    <text x="1018" y="808" fill="#ffe08a" font-size="17" font-weight="700">04 TURN</text>
    <text x="1018" y="841" fill="#ffffff" font-size="16">continue / reroute / return</text>
    <text x="1278" y="808" fill="#ffe08a" font-size="17" font-weight="700">05 RETURN</text>
    <text x="1278" y="841" fill="#ffffff" font-size="16">rejoin an everyday destination</text>
  </g>
  <line x1="368" y1="790" x2="368" y2="854" stroke="#66829a" stroke-width="2"/>
  <line x1="628" y1="790" x2="628" y2="854" stroke="#66829a" stroke-width="2"/>
  <line x1="888" y1="790" x2="888" y2="854" stroke="#66829a" stroke-width="2"/>
  <line x1="1148" y1="790" x2="1148" y2="854" stroke="#66829a" stroke-width="2"/>
  <text x="800" y="905" text-anchor="middle" fill="#526270" font-family="Arial, sans-serif" font-size="17">Every relation remains HOLD until public passage, lawful crossing, accessible alternative, maintenance and the applicable professional conditions are verified.</text>
</svg>
