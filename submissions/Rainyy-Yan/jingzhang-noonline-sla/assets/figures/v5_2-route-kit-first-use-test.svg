<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" viewBox="0 0 1600 980" role="img" aria-labelledby="title desc">
  <title id="title">Noonline Route Kit 60-second first-use test</title>
  <desc id="desc">A non-site-specific conceptual exercise showing five reading tasks: choose a mode, identify a marker, use a pause panel, respond to a route change, and return. It records no participant result and claims no existing route.</desc>
  <rect width="1600" height="980" fill="#f4f7f8"/>
  <rect x="46" y="42" width="1508" height="896" rx="8" fill="#ffffff" stroke="#19334b" stroke-width="3"/>
  <text x="100" y="116" fill="#19334b" font-family="Arial, sans-serif" font-size="40" font-weight="700">NOONLINE ROUTE KIT: 60-SECOND FIRST-USE TEST</text>
  <text x="100" y="154" fill="#526270" font-family="Arial, sans-serif" font-size="21">CONCEPT EXERCISE FOR FUTURE VERIFIED LOCATIONS - NOT A TEST RESULT OR SITE CLAIM</text>
  <rect x="1230" y="94" width="234" height="58" rx="29" fill="#fff2c9" stroke="#b98520" stroke-width="2"/>
  <text x="1347" y="130" text-anchor="middle" fill="#6e4b09" font-family="Arial, sans-serif" font-size="18" font-weight="700">NO PHONE / NO DATA</text>

  <g font-family="Arial, sans-serif">
    <rect x="100" y="242" width="270" height="436" rx="8" fill="#e9f0f6" stroke="#19334b" stroke-width="3"/>
    <text x="132" y="288" fill="#19334b" font-size="24" font-weight="700">01  CHOOSE</text>
    <text x="132" y="322" fill="#526270" font-size="17">Read KIT-01 + KIT-02</text>
    <rect x="132" y="356" width="92" height="66" rx="6" fill="#e6f3f1" stroke="#287b75" stroke-width="2"/>
    <text x="178" y="396" text-anchor="middle" fill="#154f4b" font-size="24" font-weight="700">M</text>
    <rect x="240" y="356" width="92" height="66" rx="6" fill="#fff4d8" stroke="#b98520" stroke-width="2"/>
    <text x="286" y="396" text-anchor="middle" fill="#6e4b09" font-size="24" font-weight="700">P</text>
    <text x="132" y="470" fill="#19334b" font-size="19" font-weight="700">Prompt</text>
    <text x="132" y="501" fill="#526270" font-size="17">Choose a brief-walk mode.</text>
    <text x="132" y="556" fill="#19334b" font-size="19" font-weight="700">Readable answer</text>
    <text x="132" y="587" fill="#526270" font-size="17">M + its word + its number.</text>
    <text x="132" y="638" fill="#8c4132" font-size="17" font-weight="700">If unclear: HOLD the panel.</text>

    <rect x="395" y="242" width="270" height="436" rx="8" fill="#e6f3f1" stroke="#287b75" stroke-width="3"/>
    <text x="427" y="288" fill="#154f4b" font-size="24" font-weight="700">02  WALK</text>
    <text x="427" y="322" fill="#3f7773" font-size="17">Read KIT-03</text>
    <rect x="427" y="356" width="184" height="66" rx="6" fill="#287b75"/>
    <text x="519" y="396" text-anchor="middle" fill="#ffffff" font-size="23" font-weight="700">M-01  WALK</text>
    <text x="427" y="470" fill="#154f4b" font-size="19" font-weight="700">Prompt</text>
    <text x="427" y="501" fill="#3f7773" font-size="17">Find the next physical action.</text>
    <text x="427" y="556" fill="#154f4b" font-size="19" font-weight="700">Readable answer</text>
    <text x="427" y="587" fill="#3f7773" font-size="17">Match M + 01 + WALK.</text>
    <text x="427" y="638" fill="#8c4132" font-size="17" font-weight="700">If unclear: HOLD the marker.</text>

    <rect x="690" y="242" width="270" height="436" rx="8" fill="#fff4d8" stroke="#b98520" stroke-width="3"/>
    <text x="722" y="288" fill="#6e4b09" font-size="24" font-weight="700">03  PAUSE</text>
    <text x="722" y="322" fill="#88671e" font-size="17">Read KIT-04</text>
    <rect x="722" y="356" width="206" height="66" rx="6" fill="#ffffff" stroke="#b98520" stroke-width="2"/>
    <text x="825" y="396" text-anchor="middle" fill="#6e4b09" font-size="18" font-weight="700">CONTINUE / RETURN</text>
    <text x="722" y="470" fill="#6e4b09" font-size="19" font-weight="700">Prompt</text>
    <text x="722" y="501" fill="#88671e" font-size="17">Skip the pause and return.</text>
    <text x="722" y="556" fill="#6e4b09" font-size="19" font-weight="700">Readable answer</text>
    <text x="722" y="587" fill="#88671e" font-size="17">Choose the visible RETURN rule.</text>
    <text x="722" y="638" fill="#8c4132" font-size="17" font-weight="700">No facility is presumed.</text>

    <rect x="985" y="242" width="270" height="436" rx="8" fill="#fce9e3" stroke="#b65a45" stroke-width="3"/>
    <text x="1017" y="288" fill="#8c4132" font-size="24" font-weight="700">04  DECIDE</text>
    <text x="1017" y="322" fill="#9c5d4e" font-size="17">Read KIT-05 + KIT-06</text>
    <rect x="1017" y="356" width="206" height="66" rx="6" fill="#ffffff" stroke="#b65a45" stroke-width="2"/>
    <text x="1120" y="396" text-anchor="middle" fill="#8c4132" font-size="20" font-weight="700">REROUTE  M-02</text>
    <text x="1017" y="470" fill="#8c4132" font-size="19" font-weight="700">Prompt</text>
    <text x="1017" y="501" fill="#9c5d4e" font-size="17">The relation has changed.</text>
    <text x="1017" y="556" fill="#8c4132" font-size="19" font-weight="700">Readable answer</text>
    <text x="1017" y="580" fill="#9c5d4e" font-size="16">Follow the named alternate</text>
    <text x="1017" y="606" fill="#9c5d4e" font-size="16">marker.</text>
    <text x="1017" y="638" fill="#8c4132" font-size="17" font-weight="700">No phone alert is required.</text>

    <rect x="1280" y="242" width="270" height="436" rx="8" fill="#edf0f3" stroke="#526270" stroke-width="3"/>
    <text x="1312" y="288" fill="#19334b" font-size="24" font-weight="700">05  RETURN</text>
    <text x="1312" y="322" fill="#526270" font-size="17">Read the shared return rule</text>
    <rect x="1312" y="356" width="206" height="66" rx="6" fill="#19334b"/>
    <text x="1415" y="396" text-anchor="middle" fill="#ffffff" font-size="21" font-weight="700">RETURN TO START</text>
    <text x="1312" y="470" fill="#19334b" font-size="19" font-weight="700">Prompt</text>
    <text x="1312" y="501" fill="#526270" font-size="17">End without digital guidance.</text>
    <text x="1312" y="556" fill="#19334b" font-size="19" font-weight="700">Readable answer</text>
    <text x="1312" y="580" fill="#526270" font-size="16">Return through the known</text>
    <text x="1312" y="606" fill="#526270" font-size="16">relation.</text>
    <text x="1312" y="638" fill="#8c4132" font-size="17" font-weight="700">If unclear: do not release.</text>
  </g>

  <path d="M370 460 H393 M665 460 H688 M960 460 H983 M1255 460 H1278" fill="none" stroke="#526270" stroke-width="5"/>
  <rect x="100" y="748" width="1450" height="148" rx="8" fill="#19334b"/>
  <text x="140" y="794" fill="#ffe08a" font-family="Arial, sans-serif" font-size="22" font-weight="700">WHAT THIS EXERCISE CAN AND CANNOT SHOW</text>
  <text x="140" y="824" fill="#ffffff" font-family="Arial, sans-serif" font-size="17">Record COMPLETE / INCOMPLETE / UNCERTAIN only. Do not collect identity, face, trajectory or device data.</text>
  <text x="140" y="850" fill="#d7e4ef" font-family="Arial, sans-serif" font-size="17">No result is pre-filled. Passing one exercise does not verify access, accessibility, safety, a facility, permit or implementation.</text>
  <text x="140" y="876" fill="#d7e4ef" font-family="Arial, sans-serif" font-size="17">It cannot promote a Verified SLA.</text>
</svg>
