<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc">
  <title id="title">Noonline Route Kit concept diagram</title>
  <desc id="desc">A non-site-specific conceptual interface showing a future verified start panel, three use modes, six physical marker types, five self-guided actions, and four route-change states.</desc>
  <rect width="1600" height="1040" fill="#f4f7f8"/>
  <rect x="46" y="42" width="1508" height="948" rx="8" fill="#ffffff" stroke="#19334b" stroke-width="3"/>
  <text x="100" y="116" fill="#19334b" font-family="Arial, sans-serif" font-size="40" font-weight="700">NOONLINE ROUTE KIT</text>
  <text x="100" y="154" fill="#526270" font-family="Arial, sans-serif" font-size="21">A FIRST-USE PHYSICAL INTERFACE FOR FUTURE VERIFIED LOCATIONS</text>
  <rect x="1194" y="94" width="270" height="58" rx="29" fill="#fff2c9" stroke="#b98520" stroke-width="2"/>
  <text x="1329" y="130" text-anchor="middle" fill="#6e4b09" font-family="Arial, sans-serif" font-size="18" font-weight="700">CONCEPT ONLY / NOT INSTALLED</text>

  <rect x="100" y="222" width="440" height="408" rx="8" fill="#e9f0f6" stroke="#19334b" stroke-width="4"/>
  <text x="136" y="270" fill="#19334b" font-family="Arial, sans-serif" font-size="28" font-weight="700">KIT-01  START PANEL</text>
  <text x="136" y="306" fill="#526270" font-family="Arial, sans-serif" font-size="18">future verified public start</text>
  <line x1="136" y1="330" x2="504" y2="330" stroke="#9fb2c4" stroke-width="2"/>
  <text x="136" y="369" fill="#19334b" font-family="Arial, sans-serif" font-size="20" font-weight="700">1  Select a use mode</text>
  <rect x="136" y="393" width="110" height="78" rx="6" fill="#e6f3f1" stroke="#287b75" stroke-width="2"/>
  <text x="191" y="425" text-anchor="middle" fill="#154f4b" font-family="Arial, sans-serif" font-size="21" font-weight="700">M</text>
  <text x="191" y="452" text-anchor="middle" fill="#154f4b" font-family="Arial, sans-serif" font-size="16">MOVE</text>
  <rect x="264" y="393" width="110" height="78" rx="6" fill="#fff4d8" stroke="#b98520" stroke-width="2"/>
  <text x="319" y="425" text-anchor="middle" fill="#6e4b09" font-family="Arial, sans-serif" font-size="21" font-weight="700">P</text>
  <text x="319" y="452" text-anchor="middle" fill="#6e4b09" font-family="Arial, sans-serif" font-size="16">PAUSE</text>
  <rect x="392" y="393" width="110" height="78" rx="6" fill="#f5eafa" stroke="#7e5d91" stroke-width="2"/>
  <text x="447" y="425" text-anchor="middle" fill="#583c6b" font-family="Arial, sans-serif" font-size="21" font-weight="700">A</text>
  <text x="447" y="452" text-anchor="middle" fill="#583c6b" font-family="Arial, sans-serif" font-size="16">ACCESS</text>
  <text x="136" y="520" fill="#19334b" font-family="Arial, sans-serif" font-size="20" font-weight="700">2  Read one shared rule</text>
  <text x="136" y="552" fill="#526270" font-family="Arial, sans-serif" font-size="18">symbol + number + next action + return</text>
  <text x="136" y="594" fill="#19334b" font-family="Arial, sans-serif" font-size="18" font-weight="700">NO PHONE / NO LOGIN / QR OPTIONAL</text>

  <text x="623" y="254" fill="#19334b" font-family="Arial, sans-serif" font-size="24" font-weight="700">THE MARKERS A PERSON READS WHILE MOVING</text>
  <g font-family="Arial, sans-serif">
    <rect x="615" y="302" width="176" height="144" rx="8" fill="#19334b"/>
    <text x="703" y="346" text-anchor="middle" fill="#ffe08a" font-size="19" font-weight="700">KIT-02</text>
    <text x="703" y="382" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">MODE</text>
    <text x="703" y="414" text-anchor="middle" fill="#d7e4ef" font-size="16">match word + symbol</text>
    <rect x="815" y="302" width="176" height="144" rx="8" fill="#287b75"/>
    <text x="903" y="346" text-anchor="middle" fill="#fff2c9" font-size="19" font-weight="700">KIT-03</text>
    <text x="903" y="382" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">WALK</text>
    <text x="903" y="414" text-anchor="middle" fill="#e2f2ef" font-size="16">match the marker</text>
    <rect x="1015" y="302" width="176" height="144" rx="8" fill="#b98520"/>
    <text x="1103" y="346" text-anchor="middle" fill="#19334b" font-size="19" font-weight="700">KIT-04</text>
    <text x="1103" y="382" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">PAUSE</text>
    <text x="1103" y="414" text-anchor="middle" fill="#fff4d8" font-size="16">stay / bypass / return</text>
    <rect x="1215" y="302" width="176" height="144" rx="8" fill="#b65a45"/>
    <text x="1303" y="346" text-anchor="middle" fill="#fff2c9" font-size="19" font-weight="700">KIT-05</text>
    <text x="1303" y="382" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">TURN</text>
    <text x="1303" y="414" text-anchor="middle" fill="#fce9e3" font-size="16">continue / return</text>
  </g>
  <path d="M791 374 H813 M991 374 H1013 M1191 374 H1213" fill="none" stroke="#526270" stroke-width="4"/>
  <path d="M1390 467 H1230 Q1170 467 1170 525" fill="none" stroke="#19334b" stroke-width="5" stroke-dasharray="12 9"/>
  <text x="1176" y="505" fill="#19334b" font-family="Arial, sans-serif" font-size="19" font-weight="700">KIT-06  RETURN + STATUS</text>

  <rect x="615" y="540" width="776" height="208" rx="8" fill="#f8fafb" stroke="#9fb2c4" stroke-width="3"/>
  <text x="651" y="585" fill="#19334b" font-family="Arial, sans-serif" font-size="24" font-weight="700">STATUS CARD: A CHANGE MUST GIVE THE NEXT ACTION</text>
  <g font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="651" y="620" width="155" height="76" rx="6" fill="#e6f3f1" stroke="#287b75" stroke-width="2"/>
    <text x="729" y="652" fill="#154f4b" font-size="18" font-weight="700">CONTINUE</text><text x="729" y="679" fill="#154f4b" font-size="15">keep symbol + number</text>
    <rect x="826" y="620" width="155" height="76" rx="6" fill="#e9f0f6" stroke="#19334b" stroke-width="2"/>
    <text x="904" y="652" fill="#19334b" font-size="18" font-weight="700">REROUTE</text><text x="904" y="679" fill="#19334b" font-size="15">follow alternate marker</text>
    <rect x="1001" y="620" width="155" height="76" rx="6" fill="#fff4d8" stroke="#b98520" stroke-width="2"/>
    <text x="1079" y="652" fill="#6e4b09" font-size="18" font-weight="700">RETURN</text><text x="1079" y="679" fill="#6e4b09" font-size="15">go to known start relation</text>
    <rect x="1176" y="620" width="155" height="76" rx="6" fill="#fce9e3" stroke="#b65a45" stroke-width="2"/>
    <text x="1254" y="652" fill="#8c4132" font-size="18" font-weight="700">PAUSE</text><text x="1254" y="679" fill="#8c4132" font-size="15">do not continue this relation</text>
  </g>

  <rect x="100" y="794" width="1291" height="126" rx="8" fill="#19334b"/>
  <text x="140" y="839" fill="#ffe08a" font-family="Arial, sans-serif" font-size="22" font-weight="700">FUTURE ACTIVATION BOUNDARY</text>
  <text x="140" y="878" fill="#ffffff" font-family="Arial, sans-serif" font-size="19">A kit component appears only after public passage, lawful access, accessible alternative, physical legibility, maintenance and stop authority are authorised and verified.</text>
  <text x="140" y="905" fill="#d7e4ef" font-family="Arial, sans-serif" font-size="17">When a condition is absent, the component remains HOLD or is removed. No diagram, AI output or scan can promote it into a site fact.</text>
</svg>
